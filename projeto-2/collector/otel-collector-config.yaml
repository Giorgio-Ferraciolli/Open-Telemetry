receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  batch:
exporters:
  otlp/signoz:
    endpoint: ${env:SIGNOZ_OTLP_ENDPOINT}
    tls:
      insecure: true
  debug:
    verbosity: basic
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/signoz, debug]
