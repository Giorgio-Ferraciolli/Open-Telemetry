global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Métricas geradas pelas APLICAÇÕES (vêm via OTLP e o Collector reexpõe aqui)
  - job_name: 'otel-collector-pipeline'
    static_configs:
      - targets: ['otel-collector:8889']
        labels:
          source: 'pipeline'

  # Métricas do PRÓPRIO Collector (auto-observabilidade — taxa de drop, queue, etc)
  - job_name: 'otel-collector-internal'
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          source: 'collector-internal'
